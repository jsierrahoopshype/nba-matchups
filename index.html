<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA Matchup Database — Career H2H Stats Since 2017-18 | HoopsMatic</title>
<meta name="description" content="Every NBA player matchup since 2017-18. Possessions, points, FG% on every defender any player has faced. Search 1,500+ players and 100,000+ matchup pairs.">
<link rel="canonical" href="https://jsierrahoopshype.github.io/nba-matchups/">

<meta property="og:title" content="NBA Matchup Database | HoopsMatic">
<meta property="og:description" content="Every NBA matchup since 2017-18. Who guards who, possessions, points, FG%.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jsierrahoopshype.github.io/nba-matchups/">
<meta property="og:site_name" content="HoopsMatic">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="NBA Matchup Database | HoopsMatic">
<meta name="twitter:description" content="Every NBA matchup since 2017-18. Who guards who, possessions, points, FG%.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f7;--surface:#fff;--surface-hover:#f0f0f2;--border:#d1d1d6;
  --text:#1d1d1f;--text-secondary:#6e6e73;--accent:#3b82f6;--accent-dim:rgba(59,130,246,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);
  color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
.container{max-width:1180px;margin:0 auto;padding:1.8rem 1.5rem 4rem}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

.hdr{margin-bottom:1.5rem;text-align:center}
.hdr h1{font-size:1.8rem;font-weight:700;letter-spacing:-.03em;margin-bottom:.2rem}
.hdr .brand{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:.6rem;display:block}
.hdr .blurb{color:var(--text-secondary);font-size:.95rem;max-width:560px;margin:0 auto}

.section{margin-top:2.4rem}
.section h2{font-family:'JetBrains Mono',monospace;font-size:.72rem;
  text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);
  font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
.section h2 .shuffle{margin-left:auto;color:var(--accent);cursor:pointer;
  background:none;border:1px solid var(--border);border-radius:6px;
  padding:.25rem .55rem;font-family:'JetBrains Mono',monospace;font-size:.65rem;
  letter-spacing:.04em;transition:.15s}
.section h2 .shuffle:hover{border-color:var(--accent);background:var(--accent-dim)}

.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:.8rem}
.hero-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.55rem;
  text-decoration:none;color:var(--text);transition:.15s;cursor:pointer;min-height:140px}
.hero-card:hover{border-color:var(--accent);transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(0,0,0,.07);text-decoration:none}
.hero-card .matchup-row{display:flex;align-items:center;gap:.5rem}
.hero-card .head{width:48px;height:36px;border-radius:6px;overflow:hidden;
  background:var(--surface-hover);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.hero-card .head img{width:100%;height:100%;object-fit:cover}
.hero-card .head .fallback{font-family:'JetBrains Mono',monospace;font-size:.9rem;
  color:var(--text-secondary)}
.hero-card .pname{font-weight:700;font-size:.97rem;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-card .vs-mini{color:var(--text-secondary);font-family:'JetBrains Mono',monospace;
  font-size:.7rem;font-weight:600;margin:.1rem 0;padding-left:54px;
  text-transform:uppercase;letter-spacing:.08em}
.hero-card .blurb{font-size:.78rem;color:var(--text-secondary);line-height:1.45;
  padding-top:.4rem;border-top:1px solid var(--border);margin-top:.2rem}
.hero-card .stat-line{font-family:'JetBrains Mono',monospace;font-size:.74rem;
  font-weight:600;color:var(--accent);display:flex;justify-content:space-between;
  align-items:center;margin-top:.1rem}
.hero-card .stat-line .arrow{color:var(--text-secondary)}

/* Featured player block: identity row at top, full opponent table below */
.featured-block{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:1.2rem 1.4rem}
.featured-head{display:grid;grid-template-columns:96px 1fr;gap:1rem;align-items:center;
  margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.featured-head .head{width:96px;height:72px;border-radius:8px;overflow:hidden;
  background:var(--surface-hover);display:flex;align-items:center;justify-content:center}
.featured-head .head img{width:100%;height:100%;object-fit:cover}
.featured-head .head .fallback{font-family:'JetBrains Mono',monospace;font-size:1.4rem;
  color:var(--text-secondary)}
.featured-head .info{display:flex;flex-direction:column;gap:.2rem}
.featured-head a{text-decoration:none;color:inherit}
.featured-head a:hover .pname{color:var(--accent);text-decoration:underline}
.featured-head .pname{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;
  display:inline-flex;align-items:center;gap:.5rem}
.featured-head .flag{width:22px;height:16px;border-radius:2px;
  box-shadow:0 0 0 .5px rgba(0,0,0,.18)}
.featured-head .meta{font-family:'JetBrains Mono',monospace;font-size:.7rem;
  color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em}
.featured-head .cta{font-family:'JetBrains Mono',monospace;font-size:.7rem;
  color:var(--accent);margin-top:.4rem}

.featured-table-label{font-family:'JetBrains Mono',monospace;font-size:.62rem;
  color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;
  font-weight:600;margin-bottom:.5rem}

table.opps-mini{width:100%;border-collapse:collapse;font-size:.84rem}
table.opps-mini thead th{background:var(--surface-hover);color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.04em;font-size:.62rem;font-weight:600;
  padding:.5rem .55rem;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
table.opps-mini thead th.left{text-align:left}
table.opps-mini tbody tr{border-bottom:1px solid var(--border)}
table.opps-mini tbody tr:last-child{border-bottom:none}
table.opps-mini td{padding:.4rem .55rem;text-align:center;
  font-family:'JetBrains Mono',monospace;font-weight:500}
table.opps-mini td.opp{text-align:left;font-family:'DM Sans',sans-serif;font-weight:600}
table.opps-mini td.opp a{color:inherit;text-decoration:none}
table.opps-mini td.opp a:hover{color:var(--accent);text-decoration:underline}
.dash{color:var(--text-secondary)}

/* Recent matchups: tight 2-col grid of pair-row cards */
.recent-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:.4rem}
.recent-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:.65rem .9rem;display:flex;align-items:center;gap:.5rem;
  text-decoration:none;color:var(--text);transition:.15s;font-size:.88rem}
.recent-row:hover{border-color:var(--accent);background:var(--surface-hover);text-decoration:none}
.recent-row .heads{display:flex;flex-shrink:0;gap:-4px}
.recent-row .head{width:36px;height:28px;border-radius:5px;overflow:hidden;
  background:var(--surface-hover);display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--surface);margin-left:-6px}
.recent-row .head:first-child{margin-left:0}
.recent-row .head img{width:100%;height:100%;object-fit:cover}
.recent-row .head .fallback{font-family:'JetBrains Mono',monospace;font-size:.7rem;
  color:var(--text-secondary)}
.recent-row .names{flex:1;font-weight:600;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-row .vs{color:var(--text-secondary);margin:0 .3rem;font-weight:500;font-size:.75rem}
.recent-row .poss{font-family:'JetBrains Mono',monospace;font-size:.7rem;
  color:var(--text-secondary);font-weight:600;white-space:nowrap}

/* Search result for an H2H pair (different shape from player result) */
.search-result.pair{background:var(--accent-dim)}
.search-result.pair .nm{display:flex;align-items:center;gap:.35rem}
.search-result.pair .pair-arrow{color:var(--accent);font-family:'JetBrains Mono',monospace;
  font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600}

.search-wrap{margin:1.4rem auto 0;position:relative;max-width:640px}
.search-input{width:100%;padding:.9rem 1.1rem;font-size:1rem;font-family:inherit;
  background:var(--surface);border:1.5px solid var(--border);border-radius:12px;
  color:var(--text);outline:none;transition:.15s}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.search-results{position:absolute;top:calc(100% + .4rem);left:0;right:0;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  max-height:420px;overflow-y:auto;display:none;z-index:10;
  box-shadow:0 4px 16px rgba(0,0,0,.08)}
.search-results.on{display:block}
.search-result{padding:.7rem 1rem;cursor:pointer;display:flex;align-items:center;
  gap:.7rem;border-bottom:1px solid var(--border);transition:.1s}
.search-result:last-child{border-bottom:none}
.search-result:hover, .search-result.kbd-active{background:var(--surface-hover)}
.search-result .nm{font-weight:600;flex:1}
.search-result .meta{font-family:'JetBrains Mono',monospace;font-size:.7rem;
  color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em}
.search-result .flag{width:18px;height:13px;border-radius:2px;
  box-shadow:0 0 0 .5px rgba(0,0,0,.18)}

/* H2H lookup with two side-by-side inputs */
.h2h-lookup{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.55rem}
.h2h-lookup .label{font-family:'JetBrains Mono',monospace;font-size:.65rem;
  color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.h2h-lookup .row{display:grid;grid-template-columns:1fr auto 1fr auto;gap:.6rem;
  align-items:center}
.h2h-lookup .input-wrap{position:relative}
.h2h-lookup input{width:100%;padding:.65rem .85rem;font-size:.92rem;font-family:inherit;
  background:var(--bg);border:1.5px solid var(--border);border-radius:8px;
  color:var(--text);outline:none;transition:.15s}
.h2h-lookup input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
.h2h-lookup .vs-sep{color:var(--text-secondary);font-family:'JetBrains Mono',monospace;
  font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.h2h-lookup .go-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:.65rem 1.1rem;font-family:inherit;font-size:.85rem;font-weight:600;
  cursor:pointer;transition:.15s;white-space:nowrap}
.h2h-lookup .go-btn:hover{background:#2563eb}
.h2h-lookup .go-btn:disabled{background:var(--surface-hover);color:var(--text-secondary);
  cursor:not-allowed}
.h2h-lookup .dropdown{position:absolute;top:calc(100% + .3rem);left:0;right:0;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  max-height:260px;overflow-y:auto;display:none;z-index:10;
  box-shadow:0 4px 14px rgba(0,0,0,.08)}
.h2h-lookup .dropdown.on{display:block}
.h2h-lookup .dropdown .opt{padding:.55rem .8rem;cursor:pointer;display:flex;
  align-items:center;gap:.55rem;font-size:.85rem;border-bottom:1px solid var(--border)}
.h2h-lookup .dropdown .opt:last-child{border-bottom:none}
.h2h-lookup .dropdown .opt:hover,.h2h-lookup .dropdown .opt.kbd-active{background:var(--surface-hover)}
.h2h-lookup .selected{padding-right:2rem;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z'/></svg>");
  background-repeat:no-repeat;background-position:right .55rem center;background-size:1.1rem}

.foot{text-align:center;font-size:.72rem;color:var(--text-secondary);margin-top:3rem;
  font-family:'JetBrains Mono',monospace;line-height:1.7}

@media(max-width:600px){
  .container{padding:1.3rem 1rem 3rem}
  .hdr h1{font-size:1.4rem}
  .hero-grid{grid-template-columns:1fr}
  .featured-head{grid-template-columns:72px 1fr;gap:.8rem}
  .featured-head .head{width:72px;height:54px}
  .featured-head .pname{font-size:1.1rem}
  table.opps-mini{font-size:.74rem}
  table.opps-mini td{padding:.3rem .35rem}
}
</style>
</head>
<body>
<div class="container">
  <div class="hdr">
    <h1>NBA Matchup Database</h1>
    <p class="blurb">Every player vs every defender, since 2017-18. Possessions, points, FG percentage on the matchup.</p>
    <div class="search-wrap">
      <input class="search-input" id="search" placeholder="Search a player by name..." autocomplete="off" spellcheck="false">
      <div class="search-results" id="results"></div>
    </div>
  </div>

  <div class="section">
    <h2>Marquee matchups <button class="shuffle" id="shuffleBtn">Shuffle</button></h2>
    <div class="hero-grid" id="heroGrid"></div>
  </div>

  <div class="section">
    <h2>Look up a head-to-head</h2>
    <div class="h2h-lookup">
      <span class="label">Pick two players to see every possession between them</span>
      <div class="row">
        <div class="input-wrap">
          <input id="h2hInputA" placeholder="Player A" autocomplete="off" spellcheck="false">
          <div class="dropdown" id="h2hDropA"></div>
        </div>
        <span class="vs-sep">vs</span>
        <div class="input-wrap">
          <input id="h2hInputB" placeholder="Player B" autocomplete="off" spellcheck="false">
          <div class="dropdown" id="h2hDropB"></div>
        </div>
        <button class="go-btn" id="h2hGo" disabled>View matchup</button>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Featured player <button class="shuffle" id="shuffleFeatured">New player</button></h2>
    <div id="featuredBlock"></div>
  </div>

  <div class="section" id="recentSection" style="display:none">
    <h2>Most frequent matchups · <span id="recentSeasonLabel"></span></h2>
    <div id="recentList"></div>
  </div>

  <div class="foot">
    HoopsMatic
  </div>
</div>

<script>
const PLAYER_INDEX_URL = "data/player_index.json";
const HERO_URL = "data/hero_matchups.json";
const PAIRS_RECENT_URL = "data/pairs_recent.json";
const HEADSHOT_BASE = "https://jsierrahoopshype.github.io/nba-headshots/players/headshots/face";
const HEADSHOTS_TREE_API = "https://api.github.com/repos/jsierrahoopshype/nba-headshots/git/trees/main?recursive=1";
const HEADSHOTS_CACHE_KEY = "hoopsmatic.headshots.tree.v1";
const HEADSHOTS_CACHE_TTL_MS = 24 * 60 * 60 * 1000; // 24h
const HERO_VISIBLE = 6;
const FEATURED_TABLE_ROWS = 15;

const FEATURED_POOL = [
  "joel-embiid", "nikola-jokic", "lebron-james", "kevin-durant",
  "stephen-curry", "jayson-tatum", "luka-doncic", "shai-gilgeous-alexander",
  "anthony-edwards", "giannis-antetokounmpo", "victor-wembanyama",
  "jaylen-brown", "donovan-mitchell", "devin-booker", "damian-lillard",
  "ja-morant", "kawhi-leonard", "paul-george", "trae-young", "tyrese-haliburton",
  "karl-anthony-towns", "bam-adebayo", "paolo-banchero", "chet-holmgren",
  "deaaron-fox", "domantas-sabonis", "scottie-barnes",
];

const state = {
  players: [],
  slugToPlayer: new Map(),
  heroPool: [],
  recentPairs: [],
  // Headshot lookup: NBA player ID (string) -> exact filename (e.g. "203999-nikola-joki.png")
  // Built from the GitHub tree API once, then cached in localStorage.
  headshotsById: new Map(),
  headshotsReady: false,
  kbdIdx: -1,
};

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

function flagImg(iso, country, className = "flag") {
  if (!iso) return "";
  return `<img class="${className}" src="https://flagcdn.com/h20/${iso}.png" srcset="https://flagcdn.com/h40/${iso}.png 2x" alt="${esc(country)}" title="${esc(country)}" loading="lazy">`;
}

// Look up a headshot URL by slug. Tries the tree-API map first (handles
// repo quirks like Jokic -> nikola-joki.png with trailing accent stripped).
// Falls back to constructing the URL deterministically; that may 404 for
// players whose filename was normalized differently in the headshots repo.
function headshotUrlForSlug(slug) {
  const p = state.slugToPlayer.get(slug);
  if (!p || !p.playerId) return null;
  // Tree API lookup
  const exact = state.headshotsById.get(String(p.playerId));
  if (exact) return `${HEADSHOT_BASE}/${exact}`;
  // Deterministic fallback
  return `${HEADSHOT_BASE}/${p.playerId}-${slug}.png`;
}

function nameForSlug(slug) {
  const p = state.slugToPlayer.get(slug);
  if (p) return p.name;
  return slug.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function h2hUrl(slugA, slugB) {
  const [a, b] = [slugA, slugB].sort();
  return `m/${a}-vs-${b}.html`;
}

// Load the nba-headshots repo file list (from cache if fresh, else GitHub API).
// Populates state.headshotsById with playerId -> filename.
async function loadHeadshotsIndex() {
  // Try cache
  try {
    const cached = JSON.parse(localStorage.getItem(HEADSHOTS_CACHE_KEY) || "null");
    if (cached && cached.fetchedAt && (Date.now() - cached.fetchedAt) < HEADSHOTS_CACHE_TTL_MS) {
      for (const [k, v] of Object.entries(cached.map || {})) {
        state.headshotsById.set(k, v);
      }
      state.headshotsReady = true;
      return;
    }
  } catch (e) { /* ignore */ }

  // Fetch fresh
  try {
    const resp = await fetch(HEADSHOTS_TREE_API);
    if (!resp.ok) throw new Error(`tree API ${resp.status}`);
    const data = await resp.json();
    if (!data.tree) throw new Error("no tree in response");
    const map = {};
    for (const entry of data.tree) {
      // path format: players/headshots/face/203999-nikola-joki.png
      if (!entry.path || entry.type !== "blob") continue;
      if (!entry.path.startsWith("players/headshots/face/")) continue;
      const filename = entry.path.split("/").pop();
      // First chunk before "-" is the player ID
      const dashIdx = filename.indexOf("-");
      if (dashIdx <= 0) continue;
      const id = filename.substring(0, dashIdx);
      map[id] = filename;
    }
    for (const [k, v] of Object.entries(map)) state.headshotsById.set(k, v);
    state.headshotsReady = true;
    try {
      localStorage.setItem(HEADSHOTS_CACHE_KEY, JSON.stringify({
        fetchedAt: Date.now(),
        map,
      }));
    } catch (e) { /* localStorage quota or disabled - silently skip */ }
  } catch (e) {
    console.warn("Headshots tree API failed, falling back to deterministic URLs:", e);
    state.headshotsReady = false;
  }
}

async function load() {
  // Fetch player index + hero data + recent pairs + headshots tree in parallel.
  // Headshots fetch is best-effort; if it fails we fall back to direct URLs.
  try {
    const [idxResp, heroResp, recentResp] = await Promise.all([
      fetch(PLAYER_INDEX_URL),
      fetch(HERO_URL).catch(() => null),
      fetch(PAIRS_RECENT_URL).catch(() => null),
      loadHeadshotsIndex(),
    ]);
    if (!idxResp.ok) throw new Error("player_index.json fetch failed");
    state.players = await idxResp.json();
    for (const p of state.players) state.slugToPlayer.set(p.slug, p);
    if (heroResp && heroResp.ok) {
      const heroData = await heroResp.json();
      state.heroPool = heroData.hero_matchups || [];
    }
    if (recentResp && recentResp.ok) {
      state.recentPairs = await recentResp.json();
    }
    renderHeroes();
    renderFeatured();
    renderRecent();
  } catch (e) {
    console.error("Load failed:", e);
    document.getElementById("heroGrid").innerHTML = "<div>Failed to load. Try refreshing.</div>";
  }
}

function renderRecent() {
  if (!state.recentPairs.length) {
    document.getElementById("recentSection").style.display = "none";
    return;
  }
  const seasonLabel = state.recentPairs[0]?.season || "";
  document.getElementById("recentSeasonLabel").textContent = seasonLabel;
  document.getElementById("recentSection").style.display = "block";
  const rows = state.recentPairs.slice(0, 30).map(p => {
    const [a, b] = [p.a.slug, p.b.slug].sort();
    const aImg = headshotUrlForSlug(p.a.slug);
    const bImg = headshotUrlForSlug(p.b.slug);
    const head = (img, name) => `
      <div class="head">
        ${img ? `<img src="${img}" alt="${esc(name)}" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=fallback>·</span>'">` : '<span class="fallback">·</span>'}
      </div>`;
    return `
      <a class="recent-row" href="m/${a}-vs-${b}.html">
        <div class="heads">${head(aImg, p.a.name)}${head(bImg, p.b.name)}</div>
        <span class="names">${esc(p.a.name)}<span class="vs">vs</span>${esc(p.b.name)}</span>
        <span class="poss">${p.poss.toLocaleString()} POSS</span>
      </a>`;
  }).join("");
  document.getElementById("recentList").innerHTML = `<div class="recent-list">${rows}</div>`;
}

function renderHeroes() {
  if (!state.heroPool.length) {
    document.getElementById("heroGrid").style.display = "none";
    return;
  }
  const picks = shuffle(state.heroPool).slice(0, HERO_VISIBLE);
  const grid = document.getElementById("heroGrid");
  grid.innerHTML = picks.map((h, i) => {
    const url = h2hUrl(h.a, h.b);
    const aImg = headshotUrlForSlug(h.a);
    const bImg = headshotUrlForSlug(h.b);
    return `
      <a class="hero-card" href="${url}" id="hero-${i}">
        <div class="matchup-row">
          <div class="head">
            ${aImg ? `<img src="${aImg}" alt="${esc(nameForSlug(h.a))}" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=fallback>·</span>'">` : '<span class="fallback">·</span>'}
          </div>
          <span class="pname">${esc(nameForSlug(h.a))}</span>
        </div>
        <div class="vs-mini">vs</div>
        <div class="matchup-row">
          <div class="head">
            ${bImg ? `<img src="${bImg}" alt="${esc(nameForSlug(h.b))}" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=fallback>·</span>'">` : '<span class="fallback">·</span>'}
          </div>
          <span class="pname">${esc(nameForSlug(h.b))}</span>
        </div>
        <div class="blurb">${esc(h.blurb || "")}</div>
        <div class="stat-line">
          <span class="line-stat" id="hero-stat-${i}">Loading H2H...</span>
          <span class="arrow">→</span>
        </div>
      </a>`;
  }).join("");

  picks.forEach(async (h, i) => {
    const stat = document.getElementById(`hero-stat-${i}`);
    if (!stat) return;
    const [a, b] = [h.a, h.b].sort();
    try {
      const resp = await fetch(`data/m/${a}-vs-${b}.json`);
      if (!resp.ok) {
        stat.textContent = "No matchup data yet";
        return;
      }
      const pair = await resp.json();
      const dir1 = pair.aGuardedByB?.career || {games: 0, poss: 0};
      const dir2 = pair.bGuardedByA?.career || {games: 0, poss: 0};
      const games = Math.max(dir1.games || 0, dir2.games || 0);
      const totalPoss = (dir1.poss || 0) + (dir2.poss || 0);
      stat.textContent = `${games} games · ${totalPoss.toFixed(0)} POSS combined`;
    } catch (e) {
      stat.textContent = "—";
    }
  });
}

function pctFmt(v) {
  if (v == null) return '<span class="dash">—</span>';
  return `${(v * 100).toFixed(1)}%`;
}

async function renderFeatured() {
  // Pick a featured player: random from FEATURED_POOL that exist in the index.
  const candidates = FEATURED_POOL.filter(s => state.slugToPlayer.has(s));
  let slug;
  if (candidates.length) {
    slug = candidates[Math.floor(Math.random() * candidates.length)];
  } else {
    const top = state.players.slice(0, 20);
    if (!top.length) {
      document.getElementById("featuredBlock").innerHTML = "<div>No players available.</div>";
      return;
    }
    slug = top[Math.floor(Math.random() * top.length)].slug;
  }
  const p = state.slugToPlayer.get(slug);
  if (!p) return;

  // Header skeleton
  const headUrl = headshotUrlForSlug(slug);
  const headHtml = headUrl
    ? `<img src="${headUrl}" alt="${esc(p.name)}" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=fallback>·</span>'">`
    : '<span class="fallback">·</span>';
  const posLabel = p.pos === "G" ? "Guard" : p.pos === "F" ? "Forward" : p.pos === "C" ? "Center" : "";

  document.getElementById("featuredBlock").innerHTML = `
    <div class="featured-block">
      <div class="featured-head">
        <a href="p/${esc(slug)}.html"><div class="head">${headHtml}</div></a>
        <div class="info">
          <a href="p/${esc(slug)}.html">
            <span class="pname">${esc(p.name)}${flagImg(p.iso, p.country)}</span>
          </a>
          <span class="meta">${esc(posLabel)}${p.country ? " · " + esc(p.country) : ""}</span>
          <a class="cta" href="p/${esc(slug)}.html">See full matchup data →</a>
        </div>
      </div>
      <div class="featured-table-label">Top opponents (as offensive player)</div>
      <div id="featuredTable"><div style="font-size:.78rem;color:var(--text-secondary);padding:1rem">Loading...</div></div>
    </div>`;

  // Hydrate with player JSON
  try {
    const resp = await fetch(`data/p/${encodeURIComponent(slug)}.json`);
    if (!resp.ok) return;
    const data = await resp.json();
    const opps = (data.asOff || []).slice(0, FEATURED_TABLE_ROWS);
    const box = document.getElementById("featuredTable");
    if (!box) return;
    if (!opps.length) {
      box.innerHTML = '<div style="font-size:.78rem;color:var(--text-secondary);padding:1rem">No opponents yet</div>';
      return;
    }

    // Pre-compute efficiency stats so we can build min/max for the gradient
    const enriched = opps.map(o => {
      const c = o.career || {};
      const fgPct = c.fga > 0 ? c.fgm / c.fga : null;
      const fg3Pct = c.fg3a > 0 ? c.fg3m / c.fg3a : null;
      const ptsPer100 = c.poss > 0 ? (100 * c.pts / c.poss) : null;
      return { o, c, fgPct, fg3Pct, ptsPer100 };
    });
    const collect = (k) => enriched.map(e => e[k]).filter(v => v != null);
    const ranges = {
      fgPct:     collect("fgPct").length     ? [Math.min(...collect("fgPct")),     Math.max(...collect("fgPct"))]     : null,
      fg3Pct:    collect("fg3Pct").length    ? [Math.min(...collect("fg3Pct")),    Math.max(...collect("fg3Pct"))]    : null,
      ptsPer100: collect("ptsPer100").length ? [Math.min(...collect("ptsPer100")), Math.max(...collect("ptsPer100"))] : null,
    };

    // Heat: high values green (the featured player is on offense, so high
    // efficiency = good for them). When only one row qualifies, fall back to
    // absolute thresholds so the single value still gets a sensible color.
    function heatStyle(value, vmin, vmax) {
      if (value == null || vmax === vmin) return "";
      let t = (value - vmin) / (vmax - vmin);
      t = Math.max(0, Math.min(1, t));
      const hue = Math.round(120 * t);
      return ` style="background-color:hsl(${hue},70%,82%)"`;
    }
    function absHeat(value, kind) {
      if (value == null) return "";
      let t;
      if (kind === "fgPct")     t = (value - 0.35) / (0.55 - 0.35);
      else if (kind === "fg3Pct") t = (value - 0.20) / (0.45 - 0.20);
      else if (kind === "ptsPer100") t = (value - 0) / (130 - 0);
      else return "";
      t = Math.max(0, Math.min(1, t));
      const hue = Math.round(120 * t);
      return ` style="background-color:hsl(${hue},70%,82%)"`;
    }
    function styleFor(value, kind) {
      const rng = ranges[kind];
      if (rng && rng[0] !== rng[1]) return heatStyle(value, rng[0], rng[1]);
      return absHeat(value, kind);
    }

    const rowsHtml = enriched.map(({ o, c, fgPct, fg3Pct, ptsPer100 }) => {
      const ptsPer100Display = ptsPer100 == null ? '<span class="dash">—</span>' : ptsPer100.toFixed(1);
      const [a, b] = [slug, o.slug].sort();
      return `<tr>
        <td class="opp"><a href="m/${a}-vs-${b}.html">${esc(o.name)}</a></td>
        <td>${c.games}</td>
        <td>${c.poss.toFixed(1)}</td>
        <td>${c.pts}</td>
        <td>${c.fga}</td>
        <td${styleFor(fgPct, "fgPct")}>${pctFmt(fgPct)}</td>
        <td${styleFor(fg3Pct, "fg3Pct")}>${pctFmt(fg3Pct)}</td>
        <td${styleFor(ptsPer100, "ptsPer100")}>${ptsPer100Display}</td>
      </tr>`;
    }).join("");
    box.innerHTML = `
      <table class="opps-mini">
        <thead><tr>
          <th class="left">Opponent</th><th>G</th><th>POSS</th><th>PTS</th>
          <th>FGA</th><th>FG%</th><th>3P%</th><th>PTS/100</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>`;
  } catch (e) {
    console.error(e);
  }
}

document.getElementById("shuffleBtn").addEventListener("click", renderHeroes);
document.getElementById("shuffleFeatured").addEventListener("click", renderFeatured);

// ---- H2H lookup (two separate inputs) ---------------------------------------
const h2hState = { a: null, b: null };

function makeH2HInput(side) {
  const upper = side.toUpperCase();
  const input = document.getElementById(`h2hInput${upper}`);
  const drop = document.getElementById(`h2hDrop${upper}`);
  let kbdIdx = -1;

  function selectPlayer(p) {
    h2hState[side] = p;
    input.value = p.name;
    input.classList.add("selected");
    drop.classList.remove("on");
    drop.innerHTML = "";
    updateGoButton();
  }
  function clearSelection() {
    h2hState[side] = null;
    input.classList.remove("selected");
    updateGoButton();
  }
  function renderDrop(items) {
    if (!items.length) {
      drop.classList.remove("on");
      drop.innerHTML = "";
      return;
    }
    drop.innerHTML = items.map((p, i) => `
      <div class="opt" data-slug="${esc(p.slug)}" data-i="${i}">
        ${flagImg(p.iso, p.country)}
        <span style="flex:1">${esc(p.name)}</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--text-secondary)">${p.totalPoss.toLocaleString()}</span>
      </div>`).join("");
    drop.classList.add("on");
    kbdIdx = -1;
  }
  input.addEventListener("input", () => {
    clearSelection();
    renderDrop(searchPlayers(input.value).map(r => r.p).slice(0, 8));
  });
  input.addEventListener("keydown", (e) => {
    const opts = drop.querySelectorAll(".opt");
    if (!opts.length) return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      kbdIdx = Math.min(opts.length - 1, kbdIdx + 1);
      opts.forEach((el, i) => el.classList.toggle("kbd-active", i === kbdIdx));
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      kbdIdx = Math.max(0, kbdIdx - 1);
      opts.forEach((el, i) => el.classList.toggle("kbd-active", i === kbdIdx));
    } else if (e.key === "Enter") {
      e.preventDefault();
      const target = kbdIdx >= 0 ? opts[kbdIdx] : opts[0];
      if (target) {
        const slug = target.dataset.slug;
        const p = state.slugToPlayer.get(slug);
        if (p) selectPlayer(p);
      }
    } else if (e.key === "Escape") {
      drop.classList.remove("on");
    }
  });
  drop.addEventListener("click", (e) => {
    const el = e.target.closest(".opt");
    if (!el) return;
    const p = state.slugToPlayer.get(el.dataset.slug);
    if (p) selectPlayer(p);
  });
}

function updateGoButton() {
  const btn = document.getElementById("h2hGo");
  btn.disabled = !(h2hState.a && h2hState.b && h2hState.a.slug !== h2hState.b.slug);
}

makeH2HInput("a");
makeH2HInput("b");

document.getElementById("h2hGo").addEventListener("click", () => {
  if (!h2hState.a || !h2hState.b) return;
  const [a, b] = [h2hState.a.slug, h2hState.b.slug].sort();
  location.href = `m/${a}-vs-${b}.html`;
});

// Close H2H dropdowns when clicking outside
document.addEventListener("click", (e) => {
  if (!e.target.closest("#h2hInputA") && !e.target.closest("#h2hDropA")) {
    document.getElementById("h2hDropA").classList.remove("on");
  }
  if (!e.target.closest("#h2hInputB") && !e.target.closest("#h2hDropB")) {
    document.getElementById("h2hDropB").classList.remove("on");
  }
});
function normalize(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}
function searchPlayers(q) {
  q = normalize(q.trim());
  if (q.length < 2) return [];
  const matches = [];
  for (const p of state.players) {
    const n = normalize(p.name);
    if (n.includes(q)) {
      const startsWith = n.startsWith(q) || n.split(" ").some(t => t.startsWith(q));
      matches.push({ p, startsWith, totalPoss: p.totalPoss });
    }
  }
  matches.sort((a, b) => {
    if (a.startsWith !== b.startsWith) return a.startsWith ? -1 : 1;
    return b.totalPoss - a.totalPoss;
  });
  return matches.slice(0, 12).map(m => ({ type: "player", p: m.p }));
}

// Try to detect a head-to-head pair in the query, e.g. "embiid jokic" or
// "lebron vs durant". Returns an array of {type:"pair", a, b} entries.
// Strategy: split query into tokens (ignoring "vs"/"v"), then for each
// split point, treat the first chunk as one player and the second as the
// other. Return the best ranked pair match.
function searchPairs(q) {
  const raw = q.trim();
  if (!raw) return [];
  // Strip common separator words
  const tokens = raw.split(/\s+/).filter(t => !/^(vs|v|versus)$/i.test(t));
  if (tokens.length < 2) return [];

  // Try every split point: tokens before -> player A, tokens after -> player B
  const results = [];
  for (let split = 1; split < tokens.length; split++) {
    const qA = normalize(tokens.slice(0, split).join(" "));
    const qB = normalize(tokens.slice(split).join(" "));
    if (qA.length < 2 || qB.length < 2) continue;

    // Find best player match for each side
    let bestA = null, bestB = null;
    for (const p of state.players) {
      const n = normalize(p.name);
      if (!bestA && n.includes(qA)) {
        const startsWith = n.startsWith(qA) || n.split(" ").some(t => t.startsWith(qA));
        if (startsWith || p.totalPoss > 1000) bestA = p;
      }
      if (!bestB && n.includes(qB)) {
        const startsWith = n.startsWith(qB) || n.split(" ").some(t => t.startsWith(qB));
        if (startsWith || p.totalPoss > 1000) bestB = p;
      }
      if (bestA && bestB) break;
    }

    if (bestA && bestB && bestA.slug !== bestB.slug) {
      results.push({ type: "pair", a: bestA, b: bestB });
    }
  }
  // Return at most 1 pair result (the first/best)
  return results.slice(0, 1);
}

function searchCombined(q) {
  const pairs = searchPairs(q);
  const players = searchPlayers(q);
  // Pair results first, then players
  return [...pairs, ...players].slice(0, 12);
}

function renderResults(items) {
  const box = document.getElementById("results");
  if (!items.length) {
    box.classList.remove("on");
    box.innerHTML = "";
    return;
  }
  box.innerHTML = items.map((item, i) => {
    if (item.type === "pair") {
      const [a, b] = [item.a.slug, item.b.slug].sort();
      return `
        <div class="search-result pair" data-href="m/${a}-vs-${b}.html" data-i="${i}">
          <span class="nm">
            <span class="pair-arrow">H2H</span>
            ${esc(item.a.name)} vs ${esc(item.b.name)}
          </span>
          <span class="meta">Head-to-head page</span>
        </div>`;
    }
    const p = item.p;
    return `
      <div class="search-result" data-href="p/${esc(p.slug)}.html" data-i="${i}">
        ${flagImg(p.iso, p.country)}
        <span class="nm">${esc(p.name)}</span>
        <span class="meta">${esc(p.pos || "")} · ${p.totalPoss.toLocaleString()} POSS</span>
      </div>`;
  }).join("");
  box.classList.add("on");
  state.kbdIdx = -1;
}
const input = document.getElementById("search");
const results = document.getElementById("results");
input.addEventListener("input", () => {
  renderResults(searchPlayers(input.value));
});
input.addEventListener("keydown", (e) => {
  const items = results.querySelectorAll(".search-result");
  if (!items.length) return;
  if (e.key === "ArrowDown") {
    e.preventDefault();
    state.kbdIdx = Math.min(items.length - 1, state.kbdIdx + 1);
    items.forEach((el, i) => el.classList.toggle("kbd-active", i === state.kbdIdx));
    items[state.kbdIdx].scrollIntoView({ block: "nearest" });
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    state.kbdIdx = Math.max(0, state.kbdIdx - 1);
    items.forEach((el, i) => el.classList.toggle("kbd-active", i === state.kbdIdx));
    items[state.kbdIdx].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") {
    e.preventDefault();
    const target = state.kbdIdx >= 0 ? items[state.kbdIdx] : items[0];
    if (target && target.dataset.href) location.href = target.dataset.href;
  } else if (e.key === "Escape") {
    results.classList.remove("on");
    input.blur();
  }
});
results.addEventListener("click", (e) => {
  const el = e.target.closest(".search-result");
  if (el && el.dataset.href) location.href = el.dataset.href;
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".search-wrap")) results.classList.remove("on");
});

load();
</script>
