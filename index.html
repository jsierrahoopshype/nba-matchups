<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA Matchup Database — Career H2H Stats Since 2017-18 | HoopsMatic</title>
<meta name="description" content="Every NBA player matchup since 2017-18. Possessions, points, FG% on every defender any player has faced. Search 1,500+ players and 100,000+ matchup pairs.">
<link rel="canonical" href="https://jsierrahoopshype.github.io/nba-matchups/">

<!-- Open Graph -->
<meta property="og:title" content="NBA Matchup Database | HoopsMatic">
<meta property="og:description" content="Every NBA matchup since 2017-18. Who guards who, possessions, points, FG%.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jsierrahoopshype.github.io/nba-matchups/">
<meta property="og:site_name" content="HoopsMatic">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="NBA Matchup Database | HoopsMatic">
<meta name="twitter:description" content="Every NBA matchup since 2017-18. Who guards who, possessions, points, FG%.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f7;--surface:#fff;--surface-hover:#f0f0f2;--border:#d1d1d6;
  --text:#1d1d1f;--text-secondary:#6e6e73;--accent:#3b82f6;--accent-dim:rgba(59,130,246,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);
  color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
.container{max-width:1180px;margin:0 auto;padding:1.8rem 1.5rem 4rem}

.hdr{margin-bottom:1.5rem;text-align:center}
.hdr h1{font-size:1.8rem;font-weight:700;letter-spacing:-.03em;margin-bottom:.2rem}
.hdr .brand{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:.6rem;display:block}
.hdr .blurb{color:var(--text-secondary);font-size:.95rem;max-width:560px;margin:0 auto}

.section{margin-top:2.4rem}
.section h2{font-family:'JetBrains Mono',monospace;font-size:.72rem;
  text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);
  font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
.section h2 .shuffle{margin-left:auto;color:var(--accent);cursor:pointer;
  background:none;border:1px solid var(--border);border-radius:6px;
  padding:.25rem .55rem;font-family:'JetBrains Mono',monospace;font-size:.65rem;
  letter-spacing:.04em;transition:.15s}
.section h2 .shuffle:hover{border-color:var(--accent);background:var(--accent-dim)}

/* HERO MATCHUPS GRID with headshots */
.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:.8rem}
.hero-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.55rem;
  text-decoration:none;color:var(--text);transition:.15s;cursor:pointer;min-height:140px}
.hero-card:hover{border-color:var(--accent);transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(0,0,0,.07)}
.hero-card .matchup-row{display:flex;align-items:center;gap:.5rem}
.hero-card .head{width:48px;height:36px;border-radius:6px;overflow:hidden;
  background:var(--surface-hover);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.hero-card .head img{width:100%;height:100%;object-fit:cover}
.hero-card .head .fallback{font-family:'JetBrains Mono',monospace;font-size:.9rem;
  color:var(--text-secondary)}
.hero-card .pname{font-weight:700;font-size:.97rem;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-card .vs-mini{color:var(--text-secondary);font-family:'JetBrains Mono',monospace;
  font-size:.7rem;font-weight:600;margin:.1rem 0;padding-left:54px;
  text-transform:uppercase;letter-spacing:.08em}
.hero-card .blurb{font-size:.78rem;color:var(--text-secondary);line-height:1.45;
  padding-top:.4rem;border-top:1px solid var(--border);margin-top:.2rem}
.hero-card .stat-line{font-family:'JetBrains Mono',monospace;font-size:.74rem;
  font-weight:600;color:var(--accent);display:flex;justify-content:space-between;
  align-items:center;margin-top:.1rem}
.hero-card .stat-line .arrow{color:var(--text-secondary)}

/* FEATURED PLAYER */
.featured-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:1.2rem 1.4rem;display:grid;grid-template-columns:120px 1fr;gap:1.2rem;
  text-decoration:none;color:var(--text);transition:.15s;cursor:pointer}
.featured-card:hover{border-color:var(--accent);transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(0,0,0,.07)}
.featured-card .head{width:120px;height:90px;border-radius:8px;overflow:hidden;
  background:var(--surface-hover);display:flex;align-items:center;justify-content:center}
.featured-card .head img{width:100%;height:100%;object-fit:cover}
.featured-card .head .fallback{font-family:'JetBrains Mono',monospace;font-size:1.4rem;
  color:var(--text-secondary)}
.featured-card .info{display:flex;flex-direction:column;gap:.4rem;min-width:0}
.featured-card .name-row{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.featured-card .pname{font-size:1.3rem;font-weight:700;letter-spacing:-.02em}
.featured-card .meta{font-family:'JetBrains Mono',monospace;font-size:.7rem;
  color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em}
.featured-card .flag{width:18px;height:13px;border-radius:2px;
  box-shadow:0 0 0 .5px rgba(0,0,0,.18)}
.featured-card .opps-label{font-family:'JetBrains Mono',monospace;font-size:.62rem;
  color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;
  font-weight:600;margin-top:.3rem}
.featured-card .opps{display:flex;flex-wrap:wrap;gap:.35rem}
.featured-card .opp-chip{background:var(--surface-hover);border:1px solid var(--border);
  border-radius:6px;padding:.3rem .55rem;font-size:.78rem;font-weight:500;display:inline-flex;
  align-items:center;gap:.35rem}
.featured-card .opp-chip .poss{font-family:'JetBrains Mono',monospace;font-size:.65rem;
  color:var(--text-secondary);font-weight:600}

/* SEARCH */
.search-wrap{margin:1.4rem auto 0;position:relative;max-width:640px}
.search-input{width:100%;padding:.9rem 1.1rem;font-size:1rem;font-family:inherit;
  background:var(--surface);border:1.5px solid var(--border);border-radius:12px;
  color:var(--text);outline:none;transition:.15s}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.search-results{position:absolute;top:calc(100% + .4rem);left:0;right:0;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  max-height:420px;overflow-y:auto;display:none;z-index:10;
  box-shadow:0 4px 16px rgba(0,0,0,.08)}
.search-results.on{display:block}
.search-result{padding:.7rem 1rem;cursor:pointer;display:flex;align-items:center;
  gap:.7rem;border-bottom:1px solid var(--border);transition:.1s}
.search-result:last-child{border-bottom:none}
.search-result:hover, .search-result.kbd-active{background:var(--surface-hover)}
.search-result .nm{font-weight:600;flex:1}
.search-result .meta{font-family:'JetBrains Mono',monospace;font-size:.7rem;
  color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em}
.search-result .flag{width:18px;height:13px;border-radius:2px;
  box-shadow:0 0 0 .5px rgba(0,0,0,.18)}

.foot{text-align:center;font-size:.72rem;color:var(--text-secondary);margin-top:3rem;
  font-family:'JetBrains Mono',monospace;line-height:1.7}

@media(max-width:600px){
  .container{padding:1.3rem 1rem 3rem}
  .hdr h1{font-size:1.4rem}
  .hero-grid{grid-template-columns:1fr}
  .featured-card{grid-template-columns:80px 1fr;padding:.9rem 1rem;gap:.9rem}
  .featured-card .head{width:80px;height:60px}
  .featured-card .pname{font-size:1.1rem}
}
</style>
</head>
<body>
<div class="container">
  <div class="hdr">
    <span class="brand">HoopsMatic · Matchup Database</span>
    <h1>NBA Matchup Database</h1>
    <p class="blurb">Every player vs every defender, since 2017-18. Possessions, points, FG percentage on the matchup.</p>
    <div class="search-wrap">
      <input class="search-input" id="search" placeholder="Search a player by name..." autocomplete="off" spellcheck="false">
      <div class="search-results" id="results"></div>
    </div>
  </div>

  <div class="section">
    <h2>Marquee matchups <button class="shuffle" id="shuffleBtn">Shuffle</button></h2>
    <div class="hero-grid" id="heroGrid"></div>
  </div>

  <div class="section">
    <h2>Featured player <button class="shuffle" id="shuffleFeatured">New player</button></h2>
    <div id="featuredCard"></div>
  </div>

  <div class="foot">
    Built by HoopsMatic · Data via shufinskiy/nba_data (Apache-2.0) · Stats from stats.nba.com
  </div>
</div>

<script>
const PLAYER_INDEX_URL = "data/player_index.json";
const HERO_URL = "data/hero_matchups.json";
const HEADSHOT_BASE = "https://jsierrahoopshype.github.io/nba-headshots/players/headshots/face";
const HERO_VISIBLE = 6;

// Pool of featured player slugs - high-volume stars. Will be filtered to
// those actually present in player_index. If too few qualify, falls back
// to top-N by totalPoss.
const FEATURED_POOL = [
  "joel-embiid", "nikola-jokic", "lebron-james", "kevin-durant",
  "stephen-curry", "jayson-tatum", "luka-doncic", "shai-gilgeous-alexander",
  "anthony-edwards", "giannis-antetokounmpo", "victor-wembanyama",
  "jaylen-brown", "donovan-mitchell", "devin-booker", "damian-lillard",
  "ja-morant", "kawhi-leonard", "paul-george", "trae-young", "tyrese-haliburton",
  "karl-anthony-towns", "bam-adebayo", "paolo-banchero", "chet-holmgren",
  "deaaron-fox", "domantas-sabonis", "scottie-barnes",
];

const state = { players: [], slugToPlayer: new Map(), heroPool: [], kbdIdx: -1 };

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

function flagImg(iso, country, className = "flag") {
  if (!iso) return "";
  return `<img class="${className}" src="https://flagcdn.com/h20/${iso}.png" srcset="https://flagcdn.com/h40/${iso}.png 2x" alt="${esc(country)}" title="${esc(country)}" loading="lazy">`;
}

function headshotUrlForSlug(slug) {
  const p = state.slugToPlayer.get(slug);
  if (!p || !p.playerId) return null;
  return `${HEADSHOT_BASE}/${p.playerId}-${slug}.png`;
}

function nameForSlug(slug) {
  const p = state.slugToPlayer.get(slug);
  if (p) return p.name;
  return slug.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function h2hUrl(slugA, slugB) {
  const [a, b] = [slugA, slugB].sort();
  return `m/${a}-vs-${b}.html`;
}

async function load() {
  try {
    const [idxResp, heroResp] = await Promise.all([
      fetch(PLAYER_INDEX_URL),
      fetch(HERO_URL).catch(() => null),
    ]);
    if (!idxResp.ok) throw new Error("player_index.json fetch failed");
    state.players = await idxResp.json();
    for (const p of state.players) state.slugToPlayer.set(p.slug, p);
    if (heroResp && heroResp.ok) {
      const heroData = await heroResp.json();
      state.heroPool = heroData.hero_matchups || [];
    }
    renderHeroes();
    renderFeatured();
  } catch (e) {
    console.error("Load failed:", e);
    document.getElementById("heroGrid").innerHTML = "<div>Failed to load. Try refreshing.</div>";
  }
}

function renderHeroes() {
  if (!state.heroPool.length) {
    document.getElementById("heroGrid").style.display = "none";
    return;
  }
  const picks = shuffle(state.heroPool).slice(0, HERO_VISIBLE);
  const grid = document.getElementById("heroGrid");
  grid.innerHTML = picks.map((h, i) => {
    const url = h2hUrl(h.a, h.b);
    const aImg = headshotUrlForSlug(h.a);
    const bImg = headshotUrlForSlug(h.b);
    return `
      <a class="hero-card" href="${url}" id="hero-${i}">
        <div class="matchup-row">
          <div class="head">
            ${aImg ? `<img src="${aImg}" alt="${esc(nameForSlug(h.a))}" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=fallback>·</span>'">` : '<span class="fallback">·</span>'}
          </div>
          <span class="pname">${esc(nameForSlug(h.a))}</span>
        </div>
        <div class="vs-mini">vs</div>
        <div class="matchup-row">
          <div class="head">
            ${bImg ? `<img src="${bImg}" alt="${esc(nameForSlug(h.b))}" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=fallback>·</span>'">` : '<span class="fallback">·</span>'}
          </div>
          <span class="pname">${esc(nameForSlug(h.b))}</span>
        </div>
        <div class="blurb">${esc(h.blurb || "")}</div>
        <div class="stat-line">
          <span class="line-stat" id="hero-stat-${i}">Loading H2H...</span>
          <span class="arrow">→</span>
        </div>
      </a>`;
  }).join("");

  picks.forEach(async (h, i) => {
    const stat = document.getElementById(`hero-stat-${i}`);
    if (!stat) return;
    const [a, b] = [h.a, h.b].sort();
    try {
      const resp = await fetch(`data/m/${a}-vs-${b}.json`);
      if (!resp.ok) {
        stat.textContent = "No matchup data yet";
        return;
      }
      const pair = await resp.json();
      const dir1 = pair.aGuardedByB?.career || {games: 0, poss: 0};
      const dir2 = pair.bGuardedByA?.career || {games: 0, poss: 0};
      const games = Math.max(dir1.games || 0, dir2.games || 0);
      const totalPoss = (dir1.poss || 0) + (dir2.poss || 0);
      stat.textContent = `${games} games · ${totalPoss.toFixed(0)} POSS combined`;
    } catch (e) {
      stat.textContent = "—";
    }
  });
}

async function renderFeatured() {
  // Pick a featured player. Try pool first, fall back to top players if needed.
  const candidates = FEATURED_POOL.filter(s => state.slugToPlayer.has(s));
  let slug;
  if (candidates.length) {
    slug = candidates[Math.floor(Math.random() * candidates.length)];
  } else {
    // Fallback: pick from top 20 of search index
    const top = state.players.slice(0, 20);
    if (!top.length) {
      document.getElementById("featuredCard").innerHTML = "<div>No players available.</div>";
      return;
    }
    slug = top[Math.floor(Math.random() * top.length)].slug;
  }
  const p = state.slugToPlayer.get(slug);
  if (!p) return;

  // Skeleton card first
  const headHtml = (() => {
    const u = headshotUrlForSlug(slug);
    if (!u) return '<span class="fallback">·</span>';
    return `<img src="${u}" alt="${esc(p.name)}" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=fallback>·</span>'">`;
  })();

  document.getElementById("featuredCard").innerHTML = `
    <a class="featured-card" href="p/${esc(slug)}.html">
      <div class="head">${headHtml}</div>
      <div class="info">
        <div class="name-row">
          <span class="pname">${esc(p.name)}</span>
          ${flagImg(p.iso, p.country, "flag")}
          <span class="meta">${esc(p.pos === "G" ? "Guard" : p.pos === "F" ? "Forward" : p.pos === "C" ? "Center" : "")}${p.country ? " · " + esc(p.country) : ""}</span>
        </div>
        <span class="opps-label">Top matchups (as offensive player)</span>
        <div class="opps" id="featured-opps"><span style="font-size:.78rem;color:var(--text-secondary)">Loading...</span></div>
      </div>
    </a>`;

  // Hydrate with their top 5 opponents
  try {
    const resp = await fetch(`data/p/${encodeURIComponent(slug)}.json`);
    if (!resp.ok) return;
    const data = await resp.json();
    const top5 = (data.asOff || []).slice(0, 5);
    const opps = document.getElementById("featured-opps");
    if (!opps) return;
    if (!top5.length) {
      opps.innerHTML = '<span style="font-size:.78rem;color:var(--text-secondary)">No opponents yet</span>';
      return;
    }
    opps.innerHTML = top5.map(o => `
      <span class="opp-chip">${esc(o.name)}<span class="poss">${o.career.poss.toFixed(0)} POSS</span></span>
    `).join("");
  } catch (e) {
    console.error(e);
  }
}

document.getElementById("shuffleBtn").addEventListener("click", renderHeroes);
document.getElementById("shuffleFeatured").addEventListener("click", renderFeatured);

// ---- search -----------------------------------------------------------------
function normalize(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}
function searchPlayers(q) {
  q = normalize(q.trim());
  if (q.length < 2) return [];
  const matches = [];
  for (const p of state.players) {
    const n = normalize(p.name);
    if (n.includes(q)) {
      const startsWith = n.startsWith(q) || n.split(" ").some(t => t.startsWith(q));
      matches.push({ p, startsWith, totalPoss: p.totalPoss });
    }
  }
  matches.sort((a, b) => {
    if (a.startsWith !== b.startsWith) return a.startsWith ? -1 : 1;
    return b.totalPoss - a.totalPoss;
  });
  return matches.slice(0, 12).map(m => m.p);
}
function renderResults(items) {
  const box = document.getElementById("results");
  if (!items.length) {
    box.classList.remove("on");
    box.innerHTML = "";
    return;
  }
  box.innerHTML = items.map((p, i) => `
    <div class="search-result" data-slug="${esc(p.slug)}" data-i="${i}">
      ${flagImg(p.iso, p.country)}
      <span class="nm">${esc(p.name)}</span>
      <span class="meta">${esc(p.pos || "")} · ${p.totalPoss.toLocaleString()} POSS</span>
    </div>`).join("");
  box.classList.add("on");
  state.kbdIdx = -1;
}
const input = document.getElementById("search");
const results = document.getElementById("results");
input.addEventListener("input", () => {
  renderResults(searchPlayers(input.value));
});
input.addEventListener("keydown", (e) => {
  const items = results.querySelectorAll(".search-result");
  if (!items.length) return;
  if (e.key === "ArrowDown") {
    e.preventDefault();
    state.kbdIdx = Math.min(items.length - 1, state.kbdIdx + 1);
    items.forEach((el, i) => el.classList.toggle("kbd-active", i === state.kbdIdx));
    items[state.kbdIdx].scrollIntoView({ block: "nearest" });
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    state.kbdIdx = Math.max(0, state.kbdIdx - 1);
    items.forEach((el, i) => el.classList.toggle("kbd-active", i === state.kbdIdx));
    items[state.kbdIdx].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") {
    e.preventDefault();
    const target = state.kbdIdx >= 0 ? items[state.kbdIdx] : items[0];
    if (target) location.href = `p/${target.dataset.slug}.html`;
  } else if (e.key === "Escape") {
    results.classList.remove("on");
    input.blur();
  }
});
results.addEventListener("click", (e) => {
  const el = e.target.closest(".search-result");
  if (el) location.href = `p/${el.dataset.slug}.html`;
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".search-wrap")) results.classList.remove("on");
});

load();
</script>
</body>
</html>
