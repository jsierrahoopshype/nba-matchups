# One-off: can a GitHub Actions runner reach stats.nba.com? Runs only on
# pushes to this work branch; removed before merge.
name: Probe NBA endpoints
on:
  push:
    branches: [claude/amazing-dirac-vqb4qi]
    paths: [.github/workflows/probe-nba.yml, build/probe_nba_from_ci.py]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: build, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python build/probe_nba_from_ci.py
