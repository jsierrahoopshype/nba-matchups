# Re-applies everything in build/ after the pages are regenerated.
#
# m/ and p/ are produced by a generator that lives outside this repo. Every
# regeneration overwrites the pages and wipes the ROOT path fix, the colour
# legends, the footer removal, the hoopsmatic.com canonicals, the
# pre-rendered tables and headers, the "More matchups" links and the per-page
# titles, and keeps the sitemap's <lastmod> dates accurate. This puts them back
# automatically instead of relying on someone remembering to run seven scripts
# in the right order.
#
# See build/README.md for what each script does and why the order matters.

name: Apply build/ fixes

on:
  push:
    branches: [main]        # main only - never on pull_request, never on other branches

# Serialise runs so two pushes in quick succession cannot race each other to
# push a commit. Never cancel a run in flight: a half-applied tree must not be
# left behind.
concurrency:
  group: apply-build-fixes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    # Loop guard. GitHub does not trigger workflows for pushes made with the
    # built-in GITHUB_TOKEN, so the commit this job makes cannot retrigger it.
    # This condition is belt and braces for the day someone swaps in a PAT,
    # a deploy key or a GitHub App token, any of which DO retrigger.
    if: "!contains(github.event.head_commit.message, 'Auto: re-apply build/ fixes')"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # Shallow is enough: the scripts only ever read the working tree.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # One step per script so a failure names the culprit in the UI, and so
      # nothing reaches the commit step after an error. The scripts exit
      # non-zero on any per-file problem, and `set -euo pipefail` makes sure
      # that stops the job rather than pushing a half-applied tree.
      - name: 1/7 - fix relative paths (ROOT)
        run: |
          set -euo pipefail
          python build/fix_matchup_paths.py

      - name: 2/7 - footer removal + heat legend
        run: |
          set -euo pipefail
          python build/apply_ui_tweaks.py

      - name: 3/7 - canonical / OG / sitemap URLs
        run: |
          set -euo pipefail
          python build/fix_canonical_urls.py

      # Must come after steps 1 and 2: it snapshots what the page JS renders,
      # and that output depends on the ${ROOT} paths that step 1 puts in.
      - name: 4/7 - pre-render stat tables and headers
        run: |
          set -euo pipefail
          python build/prerender_matchup_tables.py

      # After step 4: a player page's "More matchups" skips matchups already
      # linked in the opponent table that step 4 bakes. Anchored on the heat
      # legend from step 2.
      - name: 5/7 - pre-render "More matchups" links
        run: |
          set -euo pipefail
          python build/add_related_matchups.py

      # Independent of the others: each page's static <title>, og:title and
      # twitter:title become the exact title its JS sets.
      - name: 6/7 - pre-render per-page titles
        run: |
          set -euo pipefail
          python build/prerender_page_titles.py

      # Must be last: it hashes each page's final content, so every script
      # that can change a page has to have run. A URL's <lastmod> moves only
      # when its hash does; the hashes live in build/sitemap-hashes.json.
      - name: 7/7 - sitemap <lastmod> from content hashes
        run: |
          set -euo pipefail
          python build/update_sitemap_lastmod.py

      - name: Commit and push if anything changed
        run: |
          set -euo pipefail
          rm -rf build/__pycache__

          # Stage only what the scripts are allowed to touch.
          git add -A -- m p index.html sitemap.xml robots.txt build/sitemap-hashes.json

          if git diff --cached --quiet; then
            echo "Nothing to re-apply - the tree is already correct."
            echo "No changes needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "### Re-applied build/ fixes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git diff --cached --stat | tail -n 20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto: re-apply build/ fixes after regeneration"

          # If a push landed while this job ran, rebase onto it and retry once.
          # The scripts are idempotent, so replaying this commit is safe.
          git push origin HEAD:"${{ github.ref_name }}" || {
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          }
