<style>
:root{
  --bg:#f5f5f7;--surface:#fff;--surface-hover:#f0f0f2;--border:#d1d1d6;
  --text:#1d1d1f;--text-secondary:#6e6e73;--accent:#3b82f6;--accent-dim:rgba(59,130,246,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);
  color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
.container{max-width:1180px;margin:0 auto;padding:1.5rem 1.5rem 4rem}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}

.back{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:.8rem;display:inline-block}
.back:hover{color:var(--accent)}

.matchup-hdr{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:1.4rem;margin-bottom:1.4rem;display:grid;
  grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center}
.player-card{display:flex;flex-direction:column;align-items:center;gap:.4rem;text-align:center}
.player-card .head{width:120px;height:88px;border-radius:8px;overflow:hidden;
  background:var(--surface-hover);position:relative;display:flex;align-items:center;justify-content:center}
.player-card .head img{width:100%;height:100%;object-fit:cover}
.player-card .head .fallback{font-family:'JetBrains Mono',monospace;font-size:1.5rem;
  color:var(--text-secondary)}
.player-card .nm{font-size:1.15rem;font-weight:700;letter-spacing:-.02em;
  display:inline-flex;align-items:center;gap:.4rem}
.player-card .meta{font-family:'JetBrains Mono',monospace;font-size:.7rem;
  color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em}
.player-card a{color:inherit}
.player-card a:hover .nm{color:var(--accent)}
.vs-divider{font-family:'JetBrains Mono',monospace;font-size:1.4rem;font-weight:600;
  color:var(--text-secondary);letter-spacing:.05em}
.flag-img{width:18px;height:13px;border-radius:2px;box-shadow:0 0 0 .5px rgba(0,0,0,.18)}

.toolbar{display:flex;gap:.8rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
.toolbar .label{font-family:'JetBrains Mono',monospace;font-size:.62rem;
  color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.pill{font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:600;
  padding:.46rem .7rem;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);color:var(--text-secondary);cursor:pointer;
  transition:.15s;white-space:nowrap}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}

.dir-section{margin-bottom:1.6rem}
.dir-section h2{font-family:'JetBrains Mono',monospace;font-size:.72rem;
  text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);
  font-weight:600;margin-bottom:.7rem}

.summary{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:.6rem .6rem;display:grid;grid-template-columns:repeat(10,1fr);gap:.4rem;
  margin-bottom:.6rem}
.summary .cell{display:flex;flex-direction:column;gap:.15rem;
  padding:.55rem .6rem;border-radius:6px}
.summary .lbl{font-size:.58rem;color:var(--text-secondary);text-transform:uppercase;
  letter-spacing:.05em;font-weight:600}
.summary .val{font-family:'JetBrains Mono',monospace;font-size:.95rem;font-weight:600}

.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;margin-bottom:.5rem}
table.seasons{width:100%;border-collapse:collapse;font-size:.86rem}
table.seasons thead th{background:var(--surface-hover);color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.04em;font-size:.66rem;font-weight:600;
  padding:.6rem .55rem;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
table.seasons thead th.left{text-align:left}
table.seasons tbody tr{border-bottom:1px solid var(--border)}
table.seasons tbody tr:last-child{border-bottom:none}
table.seasons td{padding:.45rem .55rem;text-align:center;
  font-family:'JetBrains Mono',monospace;font-weight:500;white-space:nowrap}
table.seasons td.season{text-align:left;font-family:'DM Sans',sans-serif;font-weight:600}
table.seasons td.phase{font-size:.7rem;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.04em}
.dash{color:var(--text-secondary)}
.empty{padding:1.5rem 1rem;text-align:center;color:var(--text-secondary);font-size:.86rem;
  background:var(--surface);border:1px solid var(--border);border-radius:12px}

.foot{text-align:center;font-size:.72rem;color:var(--text-secondary);margin-top:1.6rem;
  font-family:'JetBrains Mono',monospace;line-height:1.7}

@media(max-width:760px){
  .matchup-hdr{grid-template-columns:1fr;gap:.6rem}
  .vs-divider{margin:.2rem 0}
  .player-card .head{width:96px;height:72px}
  .player-card .nm{font-size:1rem}
  .summary{grid-template-columns:repeat(5,1fr);font-size:.85rem}
  table.seasons{font-size:.78rem}
}
</style>
</head>
<body>
<div class="container">
  <a class="back" href="../index.html">← Matchup Database</a>

  <div class="matchup-hdr" id="hdr">
    <div class="player-card" id="cardA"><div class="head"><span class="fallback">·</span></div></div>
    <div class="vs-divider">VS</div>
    <div class="player-card" id="cardB"><div class="head"><span class="fallback">·</span></div></div>
  </div>

  <div class="toolbar">
    <span class="label">Phase</span>
    <button class="pill on" data-phase="all">All</button>
    <button class="pill" data-phase="RS">Regular season</button>
    <button class="pill" data-phase="PO">Playoffs</button>
  </div>

  <div id="content"><div class="empty">Loading...</div></div>

  <div class="foot">
    HoopsMatic
  </div>
</div>

<script>
const HEADSHOT_BASE = "https://jsierrahoopshype.github.io/nba-headshots/players/headshots/face";
const state = { data: null, phase: "all", headshotsById: new Map() };

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

function normalize(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function pctFmt(v) {
  if (v == null) return '<span class="dash">—</span>';
  return `${(v * 100).toFixed(1)}%`;
}

function flagImg(iso, country) {
  if (!iso) return "";
  return `<img class="flag-img" src="https://flagcdn.com/h20/${iso}.png" srcset="https://flagcdn.com/h40/${iso}.png 2x" alt="${esc(country)}" title="${esc(country)}" loading="lazy">`;
}

function headshotUrl(playerId, slug) {
  // Try the tree-API map first (handles repo filename quirks like
  // Jokic -> nikola-joki.png with trailing accent stripped).
  const exact = state.headshotsById.get(String(playerId));
  if (exact) return `${HEADSHOT_BASE}/${exact}`;
  // Deterministic fallback - may 404 for some accented names
  return `${HEADSHOT_BASE}/${playerId}-${slug}.png`;
}

function getSlug() {
  const m = location.pathname.match(/\/m\/([^/]+?)\.html$/);
  return m ? decodeURIComponent(m[1]) : null;
}

// Load nba-headshots tree from GitHub API or localStorage cache
const HEADSHOTS_TREE_API = "https://api.github.com/repos/jsierrahoopshype/nba-headshots/git/trees/main?recursive=1";
const HEADSHOTS_CACHE_KEY = "hoopsmatic.headshots.tree.v1";
const HEADSHOTS_CACHE_TTL_MS = 24 * 60 * 60 * 1000;

async function loadHeadshotsIndex() {
  try {
    const cached = JSON.parse(localStorage.getItem(HEADSHOTS_CACHE_KEY) || "null");
    if (cached && cached.fetchedAt && (Date.now() - cached.fetchedAt) < HEADSHOTS_CACHE_TTL_MS) {
      for (const [k, v] of Object.entries(cached.map || {})) {
        state.headshotsById.set(k, v);
      }
      return;
    }
  } catch (e) { /* ignore */ }
  try {
    const resp = await fetch(HEADSHOTS_TREE_API);
    if (!resp.ok) return;
    const data = await resp.json();
    if (!data.tree) return;
    const map = {};
    for (const entry of data.tree) {
      if (!entry.path || entry.type !== "blob") continue;
      if (!entry.path.startsWith("players/headshots/face/")) continue;
      const filename = entry.path.split("/").pop();
      const dashIdx = filename.indexOf("-");
      if (dashIdx <= 0) continue;
      const id = filename.substring(0, dashIdx);
      map[id] = filename;
    }
    for (const [k, v] of Object.entries(map)) state.headshotsById.set(k, v);
    try {
      localStorage.setItem(HEADSHOTS_CACHE_KEY, JSON.stringify({ fetchedAt: Date.now(), map }));
    } catch (e) { /* ignore */ }
  } catch (e) {
    console.warn("Headshots tree fetch failed; using deterministic URLs:", e);
  }
}

async function load() {
  const slug = getSlug();
  if (!slug) {
    document.getElementById("content").innerHTML = "<div class='empty'>Invalid URL.</div>";
    return;
  }
  try {
    // Fetch pair data + headshots tree in parallel
    const [resp] = await Promise.all([
      fetch(`../data/m/${encodeURIComponent(slug)}.json`),
      loadHeadshotsIndex(),
    ]);
    if (!resp.ok) throw new Error(`fetch failed: ${resp.status}`);
    state.data = await resp.json();
    document.title = `${state.data.playerA.name} vs ${state.data.playerB.name} — NBA Head-to-Head Stats | HoopsMatic`;
    renderHeader();
    renderDirections();
  } catch (e) {
    console.error(e);
    document.getElementById("content").innerHTML =
      "<div class='empty'>No head-to-head data for this matchup.</div>";
  }
}

function renderPlayerCard(boxId, p) {
  const box = document.getElementById(boxId);
  box.innerHTML = `
    <a href="../p/${esc(p.slug)}.html">
      <div class="head">
        <img src="${headshotUrl(p.id, p.slug)}" alt="${esc(p.name)}" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=fallback>·</span>'">
      </div>
      <div class="nm">${esc(p.name)}${flagImg(p.iso, p.country)}</div>
      <div class="meta">${esc(p.pos === "G" ? "Guard" : p.pos === "F" ? "Forward" : p.pos === "C" ? "Center" : "")}</div>
    </a>`;
}

function renderHeader() {
  renderPlayerCard("cardA", state.data.playerA);
  renderPlayerCard("cardB", state.data.playerB);
}

function statsForDir(dirData) {
  // dirData is either aGuardedByB or bGuardedByA.
  if (state.phase === "all") return dirData.career;
  return dirData.byPhase?.[state.phase] || null;
}

// Absolute heat thresholds for stats with no series to compare against.
// Used by the summary card (one row) and as a fallback for single-season
// tables. Values outside the bands clamp to red/green extremes.
function absHeatStyle(value, kind) {
  if (value == null) return "";
  let t;
  if (kind === "fgPct")          t = (value - 0.35) / (0.55 - 0.35);
  else if (kind === "fg3Pct")    t = (value - 0.20) / (0.45 - 0.20);
  else if (kind === "efg")       t = (value - 0.40) / (0.62 - 0.40);
  else if (kind === "ptsPer100") t = (value - 0)    / (130 - 0);
  else if (kind === "astPer100") t = (value - 0)    / (12 - 0);   // 12+ AST/100 is elite
  else if (kind === "tovPer100") t = 1 - ((value - 0) / (15 - 0)); // low TOV = green
  else if (kind === "tov")       t = 1 - (value / 10);
  else return "";
  t = Math.max(0, Math.min(1, t));
  const hue = Math.round(120 * t);
  return ` style="background-color:hsl(${hue},70%,82%)"`;
}

function renderSummary(dirData, label, defenderName) {
  const s = statsForDir(dirData);
  if (!s || (s.poss || 0) === 0) {
    return `<div class="empty">No matchup data when guarded by ${esc(defenderName)} in this phase.</div>`;
  }
  const fgPct = s.fga > 0 ? s.fgm / s.fga : null;
  const fg3Pct = s.fg3a > 0 ? s.fg3m / s.fg3a : null;
  const efg = s.fga > 0 ? ((s.fgm + 0.5 * s.fg3m) / s.fga) : null;
  const ptsPer100 = s.poss > 0 ? (100 * s.pts / s.poss) : null;
  const astPer100 = s.poss > 0 ? (100 * s.ast / s.poss) : null;
  const tovPer100 = s.poss > 0 ? (100 * s.tov / s.poss) : null;
  const cells = [
    ["GAMES", s.games.toLocaleString(), null],
    ["POSS", s.poss.toFixed(1), null],
    ["PTS", s.pts.toLocaleString(), null],
    ["FGA", s.fga.toLocaleString(), null],
    ["FG%", pctFmt(fgPct), absHeatStyle(fgPct, "fgPct")],
    ["3P%", pctFmt(fg3Pct), absHeatStyle(fg3Pct, "fg3Pct")],
    ["eFG%", pctFmt(efg), absHeatStyle(efg, "efg")],
    ["PTS/100", ptsPer100 == null ? '<span class="dash">—</span>' : ptsPer100.toFixed(1), absHeatStyle(ptsPer100, "ptsPer100")],
    ["AST/100", astPer100 == null ? '<span class="dash">—</span>' : astPer100.toFixed(1), absHeatStyle(astPer100, "astPer100")],
    ["TOV/100", tovPer100 == null ? '<span class="dash">—</span>' : tovPer100.toFixed(1), absHeatStyle(tovPer100, "tovPer100")],
  ];
  return `<div class="summary">${cells.map(([l, v, style]) =>
    `<div class="cell"${style || ""}><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join("")}</div>`;
}

// Gradient: low values red, high values green. goodHigh=true means higher is better.
// goodHigh=false flips direction (e.g. TOV — low is good).
function heatStyle(value, vmin, vmax, goodHigh) {
  if (value == null || vmax === vmin) return "";
  let t = (value - vmin) / (vmax - vmin);
  if (!goodHigh) t = 1 - t;
  t = Math.max(0, Math.min(1, t));
  const hue = Math.round(120 * t);
  return ` style="background-color:hsl(${hue},70%,82%)"`;
}

function renderSeasonsTable(dirData) {
  // bySeason: per-season totals (RS+PO combined for that season).
  //
  // Heat map logic: the section header tells the reader whose offense this
  // is (e.g. "Mitchell on offense, guarded by Brown"). So "good" stats are
  // those that show the offensive player did well: high FG%, high 3P%, high
  // eFG%, high PTS/100, high AST/100. TOV/100 is bad for the offensive player.
  //
  // Counting stats (G, POSS) aren't heat-mapped because they measure sample
  // size, not efficiency. We drop raw PTS/AST/TOV in favor of per-100 versions.
  const seasons = dirData.bySeason || {};
  const sorted = Object.entries(seasons).sort(([a], [b]) => a < b ? -1 : 1);
  if (!sorted.length) return "";

  const enriched = sorted.map(([season, s]) => {
    const fgPct = s.fga > 0 ? s.fgm / s.fga : null;
    const fg3Pct = s.fg3a > 0 ? s.fg3m / s.fg3a : null;
    const efg = s.fga > 0 ? ((s.fgm + 0.5 * s.fg3m) / s.fga) : null;
    const ptsPer100 = s.poss > 0 ? (100 * s.pts / s.poss) : null;
    const astPer100 = s.poss > 0 ? (100 * s.ast / s.poss) : null;
    const tovPer100 = s.poss > 0 ? (100 * s.tov / s.poss) : null;
    return { season, s, fgPct, fg3Pct, efg, ptsPer100, astPer100, tovPer100 };
  });

  // Min/max for each heat-mapped column across seasons. Single-season tables
  // (only one row) fall back to absolute thresholds.
  const collect = (key) => enriched.map(e => e[key]).filter(v => v != null);
  const ranges = {
    fgPct:     collect("fgPct").length     ? [Math.min(...collect("fgPct")),     Math.max(...collect("fgPct"))]     : null,
    fg3Pct:    collect("fg3Pct").length    ? [Math.min(...collect("fg3Pct")),    Math.max(...collect("fg3Pct"))]    : null,
    efg:       collect("efg").length       ? [Math.min(...collect("efg")),       Math.max(...collect("efg"))]       : null,
    ptsPer100: collect("ptsPer100").length ? [Math.min(...collect("ptsPer100")), Math.max(...collect("ptsPer100"))] : null,
    astPer100: collect("astPer100").length ? [Math.min(...collect("astPer100")), Math.max(...collect("astPer100"))] : null,
    tovPer100: collect("tovPer100").length ? [Math.min(...collect("tovPer100")), Math.max(...collect("tovPer100"))] : null,
  };

  const useAbsolute = sorted.length < 2;
  function styleFor(value, kind, goodHigh) {
    if (useAbsolute) return absHeatStyle(value, kind);
    const rng = ranges[kind];
    if (!rng) return "";
    return heatStyle(value, rng[0], rng[1], goodHigh);
  }

  const rows = enriched.map(({ season, s, fgPct, fg3Pct, efg, ptsPer100, astPer100, tovPer100 }) => {
    const dec = (v) => v == null ? '<span class="dash">—</span>' : v.toFixed(1);
    return `<tr>
      <td class="season">${esc(season)}</td>
      <td>${s.games}</td>
      <td>${s.poss.toFixed(1)}</td>
      <td>${s.fga}</td>
      <td>${s.fg3a}</td>
      <td${styleFor(fgPct, "fgPct", true)}>${pctFmt(fgPct)}</td>
      <td${styleFor(fg3Pct, "fg3Pct", true)}>${pctFmt(fg3Pct)}</td>
      <td${styleFor(efg, "efg", true)}>${pctFmt(efg)}</td>
      <td${styleFor(ptsPer100, "ptsPer100", true)}>${dec(ptsPer100)}</td>
      <td${styleFor(astPer100, "astPer100", true)}>${dec(astPer100)}</td>
      <td${styleFor(tovPer100, "tovPer100", false)}>${dec(tovPer100)}</td>
    </tr>`;
  }).join("");
  return `<div class="table-wrap"><table class="seasons">
    <thead><tr>
      <th class="left">Season</th><th>GP</th><th>POSS</th>
      <th>FGA</th><th>3PA</th>
      <th>FG%</th><th>3P%</th><th>eFG%</th>
      <th>PTS/100</th><th>AST/100</th><th>TOV/100</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderDirections() {
  const a = state.data.playerA;
  const b = state.data.playerB;
  const html = `
    <div class="dir-section">
      <h2>${esc(a.name)} on offense · guarded by ${esc(b.name)}</h2>
      ${renderSummary(state.data.aGuardedByB, "A vs B", b.name)}
      ${renderSeasonsTable(state.data.aGuardedByB)}
    </div>
    <div class="dir-section">
      <h2>${esc(b.name)} on offense · guarded by ${esc(a.name)}</h2>
      ${renderSummary(state.data.bGuardedByA, "B vs A", a.name)}
      ${renderSeasonsTable(state.data.bGuardedByA)}
    </div>`;
  document.getElementById("content").innerHTML = html;
}

document.querySelectorAll(".pill[data-phase]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".pill[data-phase]").forEach(b => b.classList.toggle("on", b === btn));
    state.phase = btn.dataset.phase;
    renderDirections();
  });
});

load();
</script>
</body>
</html>
